<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEXA Social App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: #070b14 !important;
      color: #e8edff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #mexa-app {
      min-height: 100vh;
    }

    /* =====================
       LOADING
    ===================== */

    .loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070b14;
      color: #d9e2ff;
      font-size: 18px;
    }

    /* =====================
       HOME
    ===================== */

    .mexa-home {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #30498a 0%,
          #111827 48%,
          #070b14 100%
        );
    }

    /* =====================
       LOGO
       M → E → X → A
    ===================== */

    .mexa-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }

    .logo-m,
    .logo-a {
      color: #d9e2ff;
      text-shadow:
        0 0 18px rgba(150,170,255,.35);
    }

    .logo-x {
      color: #9daaff;
      text-shadow:
        0 0 18px rgba(125,140,255,.45);
    }

    .logo-e {
      width: 22px;
      height: 29px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo-e i {
      display: block;
      width: 22px;
      height: 4px;
      border-radius: 5px;
      background: #d9e2ff;
      box-shadow:
        0 0 10px rgba(150,170,255,.3);
    }

    .logo-e i:nth-child(2) {
      width: 15px;
    }

    /* =====================
       HEADER
    ===================== */

    .mexa-header {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 0 28px;

      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(7,11,20,.92);

      border-bottom:
        1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(18px);
    }

    .mexa-search {
      flex: 1;
      max-width: 600px;

      height: 44px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 16px;

      border-radius: 14px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid rgba(255,255,255,.08);
    }

    .mexa-search input {
      width: 100%;

      border: none;
      outline: none;

      background: transparent;

      color: white;
    }

    .mexa-search input::placeholder {
      color: #9aa6c4;
    }

    .mexa-header-actions {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }

    .mexa-header-actions button {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 12px;

      background:
        rgba(255,255,255,.07);

      color: white;
    }

    /* =====================
       LAYOUT
    ===================== */

    .mexa-layout {
      max-width: 1500px;
      margin: auto;

      display: grid;

      grid-template-columns:
        230px
        minmax(400px,1fr)
        280px;

      gap: 22px;

      padding: 22px;
    }

    /* =====================
       SIDEBAR
    ===================== */

    .mexa-sidebar {
      display: flex;
      flex-direction: column;
      gap: 7px;

      position: sticky;
      top: 94px;

      height: max-content;
    }

    .mexa-sidebar button {
      width: 100%;
      min-height: 45px;

      display: flex;
      align-items: center;
      gap: 13px;

      padding: 0 15px;

      border: none;
      border-radius: 12px;

      background: transparent;

      color: #b8c2dc;

      text-align: left;
    }

    .mexa-sidebar button:hover,
    .mexa-sidebar button.active {
      background:
        rgba(120,140,255,.16);

      color: white;
    }

    .mexa-sidebar #logout {
      margin-top: 12px;
      color: #ffb7b7;
    }

    /* =====================
       CARD
    ===================== */

    .mexa-card {
      background:
        rgba(17,24,39,.78);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.28);

      backdrop-filter:
        blur(15px);
    }

    /* =====================
       STORIES
    ===================== */

    .stories {
      padding: 18px;
      margin-bottom: 18px;
    }

    .stories h3 {
      margin-bottom: 15px;
    }

    .stories-row {
      display: flex;
      gap: 12px;

      overflow-x: auto;
    }

    .story {
      min-width: 105px;
      height: 145px;

      padding: 10px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      border-radius: 14px;

      background:
        linear-gradient(
          160deg,
          #3b4f92,
          #161d35
        );
    }

    .story-avatar,
    .default-avatar,
    .post-avatar,
    .friend-avatar {
      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      font-weight: bold;
      color: white;

      background:
        linear-gradient(
          135deg,
          #6575d8,
          #313b78
        );
    }

    .story-avatar {
      width: 45px;
      height: 45px;

      margin-bottom: auto;
    }

    .create-story > div {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.12);

      font-size: 25px;

      margin-bottom: auto;
    }

    .story span {
      font-size: 13px;
    }

    /* =====================
       CREATE POST
    ===================== */

    .create-post {
      padding: 18px;
      margin-bottom: 18px;
    }

    .post-input {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .default-avatar {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
    }

    .post-input input {
      width: 100%;
      height: 45px;

      padding: 0 16px;

      border-radius: 25px;

      border:
        1px solid rgba(255,255,255,.08);

      outline: none;

      background:
        rgba(255,255,255,.06);

      color: white;
    }

    .post-input input::placeholder {
      color: #9aa6c4;
    }

    .post-actions,
    .post-buttons {
      display: flex;
      gap: 5px;
    }

    .post-actions {
      margin-top: 15px;
    }

    .post-actions button,
    .post-buttons button {
      flex: 1;

      padding: 11px;

      border: none;
      border-radius: 10px;

      background: transparent;

      color: #c8d1ea;
    }

    .post-actions button:hover,
    .post-buttons button:hover {
      background:
        rgba(255,255,255,.07);
    }

    /* =====================
       POST
    ===================== */

    .post {
      padding: 18px;
      margin-bottom: 18px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-avatar {
      width: 45px;
      height: 45px;
    }

    .post-header strong {
      display: block;
      color: white;
    }

    .post-header small {
      display: block;
      margin-top: 3px;
      color: #8f9bb8;
    }

    .post-menu {
      margin-left: auto;

      width: 36px;
      height: 36px;

      border: none;
      border-radius: 10px;

      background: transparent;

      color: #b9c2d8;

      font-size: 22px;
    }

    .post-content {
      padding: 20px 5px;

      line-height: 1.6;

      color: #e6eaff;
    }

    .post-stats {
      display: flex;
      justify-content: space-between;

      padding: 10px 5px;

      border-bottom:
        1px solid rgba(255,255,255,.07);

      color: #8995b2;

      font-size: 13px;
    }

    /* =====================
       RIGHT
    ===================== */

    .online-card {
      padding: 18px;

      position: sticky;
      top: 94px;
    }

    .online-card h3 {
      margin-bottom: 18px;
    }

    .online-user {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 9px 0;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #54d98c;

      box-shadow:
        0 0 10px rgba(84,217,140,.7);
    }

    .friend-avatar {
      width: 38px;
      height: 38px;
    }

    /* =====================
       RESPONSIVE
    ===================== */

    @media (max-width:1100px) {

      .mexa-layout {
        grid-template-columns:
          200px
          minmax(0,1fr);
      }

      .mexa-right {
        display: none;
      }

    }

    @media (max-width:760px) {

      .mexa-header {
        padding: 12px 15px;
        flex-wrap: wrap;
      }

      .mexa-logo {
        font-size: 26px;
      }

      .mexa-search {
        order: 3;
        flex-basis: 100%;
        max-width: none;
      }

      .mexa-layout {
        display: block;
        padding: 12px;
      }

      .mexa-sidebar {
        position: static;

        display: grid;

        grid-template-columns:
          repeat(4,1fr);

        margin-bottom: 15px;
      }

      .mexa-sidebar button {
        justify-content: center;
        padding: 8px 4px;
      }

      .mexa-sidebar button span {
        display: none;
      }

      .mexa-sidebar #logout {
        margin-top: 0;
      }

      .post-actions,
      .post-buttons {
        flex-wrap: wrap;
      }

    }

    @media (max-width:430px) {

      .mexa-sidebar {
        grid-template-columns:
          repeat(3,1fr);
      }

      .story {
        min-width: 95px;
        height: 130px;
      }

    }
  </style>
</head>

<body>

  <div id="mexa-app">
    <div class="loading">
      Memuat MEXA...
    </div>
  </div>


  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";


    /* =====================
       SUPABASE
    ===================== */

    const SUPABASE_URL =
      "https://cnxmogmmeixhzjqzpzqf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__dnVVEE7jYGfiEGaXbszuw_DHBeWA7Y";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const app =
      document.getElementById(
        "mexa-app"
      );


    /* =====================
       LOGIN CHECK
    ===================== */

    async function startMEXA() {

      try {

        const {
          data,
          error
        } =
          await supabase.auth.getSession();


        if (error) {

          console.error(error);

          window.location.href =
            "./login.html";

          return;
        }


        const session =
          data?.session;


        if (!session) {

          window.location.href =
            "./login.html";

          return;
        }


        showHome(session.user);

      }

      catch (error) {

        console.error(error);

        window.location.href =
          "./login.html";

      }

    }


    /* =====================
       HOME
    ===================== */

    function showHome(user) {

      const metadata =
        user?.user_metadata || {};


      const name =
        metadata.display_name ||
        metadata.username ||
        "MEXA User";


      const letter =
        name
          .charAt(0)
          .toUpperCase();


      app.innerHTML = `

        <div class="mexa-home">


          <!-- HEADER -->

          <header class="mexa-header">

            <div class="mexa-logo">

              <span class="logo-m">
                M
              </span>

              <span
                class="logo-e"
                aria-label="E"
              >
                <i></i>
                <i></i>
                <i></i>
              </span>

              <span class="logo-x">
                X
              </span>

              <span class="logo-a">
                A
              </span>

            </div>


            <div class="mexa-search">

              <span>
                🔍
              </span>

              <input
                type="search"
                placeholder="Cari di MEXA..."
              >

            </div>


            <div class="mexa-header-actions">

              <button>
                🔔
              </button>

              <button>
                💬
              </button>

              <button>
                👤
              </button>

            </div>

          </header>


          <!-- LAYOUT -->

          <div class="mexa-layout">


            <!-- SIDEBAR -->

            <aside class="mexa-sidebar">

              <button class="active">
                🏠
                <span>Home</span>
              </button>

              <button>
                👤
                <span>Profil</span>
              </button>

              <button>
                👥
                <span>Teman</span>
              </button>

              <button>
                📝
                <span>Postingan</span>
              </button>

              <button>
                📷
                <span>Foto</span>
              </button>

              <button>
                🎬
                <span>Video</span>
              </button>

              <button>
                ▶️
                <span>Reels</span>
              </button>

              <button>
                💬
                <span>Messenger</span>
              </button>

              <button>
                🔔
                <span>Notifikasi</span>
              </button>

              <button>
                🤖
                <span>MEXA AI</span>
              </button>

              <button>
                ⚙️
                <span>Pengaturan</span>
              </button>

              <button id="logout">
                🚪
                <span>Logout</span>
              </button>

            </aside>


            <!-- FEED -->

            <main>


              <!-- STORIES -->

              <section
                class="mexa-card stories"
              >

                <h3>
                  Stories
                </h3>


                <div class="stories-row">


                  <div
                    class="story create-story"
                  >

                    <div>
                      ＋
                    </div>

                    <span>
                      Buat Story
                    </span>

                  </div>


                  <div class="story">

                    <div
                      class="story-avatar"
                    >
                      ${letter}
                    </div>

                    <span>
                      Story kamu
                    </span>

                  </div>


                  <div class="story">

                    <div
                      class="story-avatar"
                    >
                      A
                    </div>

                    <span>
                      Teman
                    </span>

                  </div>


                  <div class="story">

                    <div
                      class="story-avatar"
                    >
                      R
                    </div>

                    <span>
                      Raka
                    </span>

                  </div>


                </div>

              </section>


              <!-- CREATE POST -->

              <section
                class="mexa-card create-post"
              >

                <div class="post-input">

                  <div
                    class="default-avatar"
                  >
                    ${letter}
                  </div>

                  <input
                    type="text"
                    placeholder="Apa yang kamu pikirkan?"
                  >

                </div>


                <div class="post-actions">

                  <button>
                    📷 Foto
                  </button>

                  <button>
                    🎥 Video
                  </button>

                  <button>
                    😊 Perasaan
                  </button>

                </div>

              </section>


              <!-- POST -->

              <article
                class="mexa-card post"
              >

                <div class="post-header">

                  <div
                    class="post-avatar"
                  >
                    ${letter}
                  </div>

                  <div>

                    <strong>
                      ${name}
                    </strong>

                    <small>
                      Baru saja
                    </small>

                  </div>

                  <button
                    class="post-menu"
                  >
                    ⋯
                  </button>

                </div>


                <div class="post-content">

                  Selamat datang di MEXA! 🚀

                  <br>

                  Connect. Share. Grow.

                </div>


                <div class="post-stats">

                  <span>
                    👍 12
                  </span>

                  <span>
                    💬 4 komentar
                  </span>

                </div>


                <div class="post-buttons">

                  <button>
                    👍 Like
                  </button>

                  <button>
                    💬 Comment
                  </button>

                  <button>
                    ↗️ Share
                  </button>

                </div>

              </article>


              <!-- POST 2 -->

              <article
                class="mexa-card post"
              >

                <div class="post-header">

                  <div
                    class="post-avatar"
                  >
                    A
                  </div>

                  <div>

                    <strong>
                      Andi
                    </strong>

                    <small>
                      1 jam lalu
                    </small>

                  </div>

                  <button
                    class="post-menu"
                  >
                    ⋯
                  </button>

                </div>


                <div class="post-content">

                  Hari ini semangat terus! ✨

                </div>


                <div class="post-buttons">

                  <button>
                    👍 Like
                  </button>

                  <button>
                    💬 Comment
                  </button>

                  <button>
                    ↗️ Share
                  </button>

                </div>

              </article>


            </main>


            <!-- RIGHT SIDEBAR -->

            <aside class="mexa-right">

              <section
                class="mexa-card online-card"
              >

                <h3>
                  Teman Online
                </h3>


                <div class="online-user">

                  <span
                    class="online-dot"
                  ></span>

                  <div
                    class="friend-avatar"
                  >
                    A
                  </div>

                  <span>
                    Andi
                  </span>

                </div>


                <div class="online-user">

                  <span
                    class="online-dot"
                  ></span>

                  <div
                    class="friend-avatar"
                  >
                    R
                  </div>

                  <span>
                    Raka
                  </span>

                </div>


                <div class="online-user">

                  <span
                    class="online-dot"
                  ></span>

                  <div
                    class="friend-avatar"
                  >
                    S
                  </div>

                  <span>
                    Sinta
                  </span>

                </div>

              </section>

            </aside>


          </div>

        </div>
      `;


      /* =====================
         LOGOUT
      ===================== */

      document
        .getElementById("logout")
        .onclick = async () => {

          await supabase.auth.signOut();

          window.location.href =
            "./login.html";

        };

    }


    startMEXA();

  </script>

</body>
</html>
