<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEXA</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #30498a 0%, #111827 48%, #070b14 100%);
      color: #d9e2ff;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 18px;
      background: rgba(17,24,39,.8);
      border: 1px solid rgba(157,170,255,.25);
    }

    h1 {
      margin-top: 0;
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #9daaff;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>MEXA</h1>
    <div id="status">Memulai MEXA...</div>
  </div>

  <script type="module">

    const status = document.getElementById("status");

    function tampil(teks) {
      status.textContent = teks;
    }

    tampil("1. JavaScript berhasil dijalankan...");

    try {

      const { createClient } =
        await import(
          "https://esm.sh/@supabase/supabase-js@2"
        );

      tampil("2. Supabase library berhasil dimuat...");

      const SUPABASE_URL =
        "https://cnxmogmmeixhzjqzpzqf.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable__dnVVEE7jYGfiEGaXbszuw_DHBeWA7Y";

      const supabase =
        createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      tampil("3. Supabase client berhasil dibuat...\n\nMemeriksa sesi login...");

      const {
        data,
        error
      } = await supabase.auth.getSession();

      if (error) {
        tampil(
          "ERROR GET SESSION:\n\n" +
          error.message
        );
        throw error;
      }

      if (!data.session) {

        tampil(
          "TIDAK ADA SESI LOGIN.\n\n" +
          "Berarti MEXA tidak menemukan sesi login di browser ini.\n\n" +
          "Silakan login kembali melalui login.html."
        );

        setTimeout(() => {
          window.location.href = "./login.html";
        }, 3000);

        return;
      }

      tampil(
        "4. LOGIN BERHASIL ✅\n\n" +
        "User ID:\n" +
        data.session.user.id +
        "\n\nEmail:\n" +
        (data.session.user.email || "-") +
        "\n\nSekarang menghubungi Edge Function..."
      );

      const response =
        await fetch(
          `${SUPABASE_URL}/functions/v1/mexa-profile`,
          {
            method: "POST",
            headers: {
              "Authorization":
                `Bearer ${data.session.access_token}`,

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({})
          }
        );

      const result =
        await response.json();

      if (!response.ok) {
        tampil(
          "EDGE FUNCTION ERROR:\n\n" +
          JSON.stringify(result, null, 2)
        );
        return;
      }

      tampil(
        "5. EDGE FUNCTION BERHASIL ✅\n\n" +
        JSON.stringify(result, null, 2)
      );

    } catch (error) {

      tampil(
        "ERROR:\n\n" +
        (error?.message || String(error))
      );

    }

  </script>

</body>
</html>
